<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
    <link rel="stylesheet" href="./pixel.css">
    <title>Zack Freeman</title>
</head>
<body>
    <!-- Scene: canvas is drawn at low resolution and scaled up; object buttons are positioned over it by pixel.js -->
    <div id="scene">
        <canvas id="scene-canvas" aria-hidden="true"></canvas>
        <button class="scene-obj" data-section="about"><span class="obj-label">About</span></button>
        <button class="scene-obj" data-section="education"><span class="obj-label">Education</span></button>
        <button class="scene-obj" data-section="research"><span class="obj-label">Research</span></button>
    </div>

    <header class="hud">
        <div class="hud-title">
            <h1>Zack Freeman</h1>
            <p class="hint">&gt; click something in the scene</p>
        </div>
        <nav class="hud-links">
            <a href="https://www.linkedin.com/in/zack-freeman-9b96ba206/" target="_blank" class="pixel-btn">LinkedIn</a>
            <a href="./running_cv.pdf" target="_blank" class="pixel-btn">CV</a>
            <a href="https://github.com/zacktfreeman" target="_blank" class="pixel-btn">GitHub</a>
        </nav>
    </header>

    <dialog id="dialog" class="pixel-box">
        <button class="dialog-close" aria-label="Close">X</button>
        <div id="dialog-content"></div>
        <div class="dialog-tabs">
            <button class="pixel-btn" data-section="about">About</button>
            <button class="pixel-btn" data-section="education">Education</button>
            <button class="pixel-btn" data-section="research">Research</button>
        </div>
    </dialog>

    <!-- Section content (copied from index.html) -->
    <template id="tpl-about">
        <h2>Hey, I'm Zack Freeman</h2>
        <div class="pixel-placeholder portrait">portrait<br>(pixel art TBD)</div>
        <p>
            I'm currently a graduate student at the University of Utah, studying Computing with a specialization in Artificial Intelligence.
        </p>
        <p>
            I recently completed degrees in Computer Science and Physics at the University of Utah (B.S. in Computer Science, B.S. in Physics, May 2025).
        </p>
        <p>
            I have many interests across computer science and physics, but I am primarily interested in artificial intelligence, machine learning and deep learning, and astrophysics. In astrophysics, I am most excited about black holes, and have been searching for them in Omega Centauri for some time now (see my research tab)!
        </p>
        <p>
            While I have specific problem interests, I overall just enjoy solving difficult problems and learning new things.
        </p>
        <p>
            Outside of academics, I love to climb, ski, bike, and make coffee! I've recently picked up yoga and fly fishing as well.
        </p>
    </template>

    <template id="tpl-education">
        <h2>Education</h2>
        <h3>University of Utah</h3>
        <h4>Masters of Computing, Specialization in Artificial Intelligence | Fall 2026</h4>
        <p>Current Courses: Natural Language Processing, Artificial Intelligence, and Neuro-Symbolic Modeling.</p>
        <h4>B.S. in Computer Science | May 2025</h4>
        <p>
            GPA: 3.9/4.0<br>
            Relevant coursework: Deep Learning, Machine Learning, Algorithms, Foundations of Data Analysis, Algorithms and Data Structures, Databases
        </p>
        <h4>B.S. in Physics | May 2025</h4>
        <p>
            GPA: 3.9/4.0<br>
            Relevant coursework: Intro to Cosmology, Extragalactic Astrophysics, Quantum Mechanics, Differential Equations, Linear Algebra, Complex Variables
        </p>
        <h3>Weber State University</h3>
        <h4>Associate of Science | May 2020</h4>
        <p>GPA: 3.9/4.0</p>
    </template>

    <template id="tpl-research">
        <h2>Research</h2>
        <div class="pixel-placeholder wide">omega centauri<br>(pixel art TBD)</div>
        <p>
            My research focuses on the detection of stellar mass black holes (black holes with a mass similar to our Sun) in a globular cluster named Omega Centauri.
            To find these black holes, I use a method of detection known as microlensing. Microlensing occurs when a massive object passes in front of a distant light source,
            bending the light from the source and causing it to appear brighter for a short period of time. My work uses archival data from the Hubble Space
            Telescope to identify these microlensing events. By studying the light curves of stars within Omega Centauri, I can infer the presence of black holes in the cluster.
        </p>
        <p>This project is advised by Dr. Anil Seth and Dr. Max Häberle.</p>
    </template>

    <script src="./pixel.js"></script>
</body>
</html>
